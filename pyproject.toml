[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfb"
version = "0.1.0"
description = "A terminal file browser"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
lfb = "lfb.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lfb*"]
